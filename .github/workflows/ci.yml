name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=info
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cli
      - run: node .scopeforge-build/packages/cli/index.js version
      - run: npm run benchmark:scanner
      - run: npm run benchmark:matrix
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Run CSP browser smoke - V5 restoration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SCOPEFORGE_BROWSER_BASE_URL: http://127.0.0.1:3000
          SCOPEFORGE_BROWSER_SCREENSHOT_DIR: .artifacts/ui-acceptance
          VERCEL_ENV: preview
        run: |
          set -euo pipefail
          command -v google-chrome
          command -v chromedriver

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "--- ScopeForge server log ---"
              cat /tmp/scopeforge-next.log || true
              echo "--- ChromeDriver log ---"
              cat /tmp/scopeforge-chromedriver.log || true
            fi
            [ -f /tmp/scopeforge-next.pid ] && kill "$(cat /tmp/scopeforge-next.pid)" 2>/dev/null || true
            [ -f /tmp/scopeforge-chromedriver.pid ] && kill "$(cat /tmp/scopeforge-chromedriver.pid)" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          npm start > /tmp/scopeforge-next.log 2>&1 &
          echo $! > /tmp/scopeforge-next.pid
          chromedriver --port=9515 --allowed-ips= > /tmp/scopeforge-chromedriver.log 2>&1 &
          echo $! > /tmp/scopeforge-chromedriver.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null && curl --fail --silent http://127.0.0.1:9515/status > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Browser acceptance services did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          node tests/browser/csp-browser-smoke.mjs
      - name: Run production V5 and Turnstile diagnostic
        continue-on-error: true
        env:
          SCOPEFORGE_PRODUCTION_BASE_URL: https://scopeforge.dev
          SCOPEFORGE_BROWSER_SCREENSHOT_DIR: .artifacts/ui-acceptance
        run: |
          set -euo pipefail
          command -v google-chrome
          command -v chromedriver

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "--- Production diagnostic ChromeDriver log ---"
              cat /tmp/scopeforge-production-chromedriver.log || true
            fi
            [ -f /tmp/scopeforge-production-chromedriver.pid ] && kill "$(cat /tmp/scopeforge-production-chromedriver.pid)" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          chromedriver --port=9515 --allowed-ips= > /tmp/scopeforge-production-chromedriver.log 2>&1 &
          echo $! > /tmp/scopeforge-production-chromedriver.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9515/status > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production diagnostic ChromeDriver did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          node tests/browser/production-ui-smoke.mjs
      - name: Upload V5 visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v5-ui-acceptance-${{ github.sha }}
          path: .artifacts/ui-acceptance/*.png
          if-no-files-found: warn
          retention-days: 7
