name: Phase 10A3 superseded-head patch once

on:
  push:
    branches:
      - fix/phase-10a3-superseded-head-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'LeDoNguyenTu'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/phase-10a3-superseded-head-recovery
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact reviewed replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service_path = Path('lib/github-app/webhook-service.ts')
          service = service_path.read_text()
          old_service = '''    if (candidate.after !== authoritativeHead) {
                return finish(
                  deps,
                  input.deliveryId,
                  "processed",
                  "AUTHORITATIVE_HEAD_ADVANCED",
                  { status: "superseded", code: "AUTHORITATIVE_HEAD_ADVANCED" },
                );
              }
          '''
          # Preserve the repository's exact indentation rather than trusting YAML indentation.
          old_service = old_service.replace('              ', '')
          if service.count(old_service) != 1:
              raise SystemExit(f'expected exactly one stale-head terminal block, found {service.count(old_service)}')
          service_path.write_text(service.replace(old_service, '', 1))

          test_path = Path('tests/github-app/webhook-service.test.ts')
          test = test_path.read_text()
          old_test = '''  it("marks stale webhook after-SHA as superseded by the authoritative default head", async () => {
              const deps = dependencies({ getDefaultBranchHead: vi.fn(async () => HEAD_SHA) });

              await expect(processGitHubWebhook(verified("push", pushPayload({ after: STALE_SHA })), deps))
                .resolves.toEqual({ status: "superseded", code: "AUTHORITATIVE_HEAD_ADVANCED" });

              expect(deps.recordPushHead).not.toHaveBeenCalled();
              expect(deps.enqueueProjectSnapshot).not.toHaveBeenCalled();
              expect(deps.recordDeliveryResult).toHaveBeenCalledWith(DELIVERY_ID, "processed", "AUTHORITATIVE_HEAD_ADVANCED");
            });
          '''
          old_test = old_test.replace('          ', '')
          new_test = '''  it("recovers the provider-authoritative current head when webhook after-SHA is stale", async () => {
              const deps = dependencies({ getDefaultBranchHead: vi.fn(async () => HEAD_SHA) });

              await expect(processGitHubWebhook(verified("push", pushPayload({ after: STALE_SHA })), deps))
                .resolves.toEqual({
                  status: "queued",
                  taskId: TASK_ID,
                  executionClass: "repository_snapshot_github_public_v1",
                });

              expect(deps.recordPushHead).toHaveBeenCalledWith({
                workspaceId: WORKSPACE_ID,
                linkId: LINK_ID,
                repositoryId: REPOSITORY_ID,
                deliveryId: DELIVERY_ID,
                commitSha: HEAD_SHA,
              });
              expect(deps.enqueueProjectSnapshot).toHaveBeenCalledWith({
                workspaceId: WORKSPACE_ID,
                linkId: LINK_ID,
                deliveryId: DELIVERY_ID,
                commitSha: HEAD_SHA,
              });
              expect(JSON.stringify(vi.mocked(deps.recordPushHead).mock.calls)).not.toContain(STALE_SHA);
              expect(JSON.stringify(vi.mocked(deps.enqueueProjectSnapshot).mock.calls)).not.toContain(STALE_SHA);
              expect(deps.recordDeliveryResult).toHaveBeenCalledWith(DELIVERY_ID, "processed", "SNAPSHOT_QUEUED");
            });
          '''
          old_test = old_test.replace('          ', '')
          new_test = new_test.replace('          ', '')
          if test.count(old_test) != 1:
              raise SystemExit(f'expected exactly one obsolete superseded-head test, found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY

          git diff --check
          git diff -- lib/github-app/webhook-service.ts tests/github-app/webhook-service.test.ts

      - name: Commit as Brian
        shell: bash
        env:
          GIT_AUTHOR_NAME: Brian Le
          GIT_AUTHOR_EMAIL: 188601252+LeDoNguyenTu@users.noreply.github.com
          GIT_COMMITTER_NAME: Brian Le
          GIT_COMMITTER_EMAIL: 188601252+LeDoNguyenTu@users.noreply.github.com
        run: |
          set -euo pipefail
          git add lib/github-app/webhook-service.ts tests/github-app/webhook-service.test.ts
          git commit -m "fix: recover authoritative head from superseded push"
          git push origin HEAD:fix/phase-10a3-superseded-head-recovery
