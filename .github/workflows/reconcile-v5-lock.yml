name: Reconcile V5 lockfile

on:
  push:
    branches:
      - reconcile/command-center-ui-v5-main

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "Brian Le"
          git config user.email "188601252+LeDoNguyenTu@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize V5 lockfile [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
